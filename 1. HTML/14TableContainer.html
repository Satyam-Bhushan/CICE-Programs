<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Container</title>
  </head>
  <body>
    <h1>Course List</h1>
    <table>
      <caption>
        Available beginner courses
      </caption>
      <tr>
        <th scope="col">Code</th>
        <th scope="col">Course</th>
      </tr>
      <tr>
        <td>WD01</td>
        <td>Web Designing</td>
      </tr>
      <tr>
        <td>DB01</td>
        <td>Database Basics</td>
      </tr>
    </table>
  </body>
</html>
