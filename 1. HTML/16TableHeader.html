<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Header Example</title>
  </head>
  <body>
    <table>
      <tr>
        <th scope="col">Subject</th>
        <th scope="col">Marks</th>
      </tr>
      <tr>
        <th scope="row">HTML</th>
        <td>85</td>
      </tr>
      <tr>
        <th scope="row">CSS</th>
        <td>90</td>
      </tr>
    </table>
  </body>
</html>
