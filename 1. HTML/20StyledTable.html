<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Table</title>
    <style>
        table {
            width:100%;
            border-collapse:collapse;
        }
        caption {
            font-weight:bold;
            margin-bottom:8px;
        }
        th, td {
            padding:10px;
            border:1px solid #9aa6b2;
            text-align:left;
        }
        th {
            background:#e8eef5;
        }
        tbody tr:nth-child(even) {
            background:#f6f8fa;
        }
    </style>
</head>
<body>
    <table>
        <caption>Employee details</caption>
        <thead>
            <tr>
                <th scope="col">Code</th>
                <th scope="col">Name</th>
                <th scope="col">Department</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1001</td>
                <td>Riya</td>
                <td>Design</td>
            </tr>
            <tr>
                <td>1002</td>
                <td>Arjun</td>
                <td>IT</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
