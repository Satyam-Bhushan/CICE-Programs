<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Row Example</title>
  </head>
  <body>
    <h1>Student Records</h1>
    <table>
      <tr>
        <th scope="col">Roll No.</th>
        <th scope="col">Name</th>
      </tr>
      <tr>
        <td>101</td>
        <td>Asha</td>
      </tr>
      <tr>
        <td>102</td>
        <td>Ravi</td>
      </tr>
    </table>
  </body>
</html>
