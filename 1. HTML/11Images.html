<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Images</title>
    <style>
      img {
        max-width: 100%;
        height: auto;
      }
      figure {
        max-width: 520px;
        margin: 24px 0;
      }
    </style>
  </head>
  <body>
    <h1>Campus Gallery</h1>
    <figure>
      <img
        src="images/library.avif"
        alt="Campus library entrance"
        width="800"
        height="500"
      />
      <figcaption>The campus library entrance.</figcaption>
    </figure>
    <a href="gallery.html">
      <img
        src="images/gallery-cover.avif"
        alt="Open the complete campus gallery"
        width="220"
      />
    </a>
  </body>
</html>
