<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rowspan and Colspan</title>
    <style>
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #777;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Class Schedule</h1>
    <table>
      <tr>
        <th colspan="3">Morning Schedule</th>
      </tr>
      <tr>
        <th scope="col">Room</th>
        <th scope="col">9 AM</th>
        <th scope="col">10 AM</th>
      </tr>
      <tr>
        <th scope="row">Lab 1</th>
        <td>HTML</td>
        <td>CSS</td>
      </tr>
      <tr>
        <th scope="row">Lab 2</th>
        <td rowspan="2">Computer Practice</td>
        <td>Database</td>
      </tr>
      <tr>
        <th scope="row">Lab 3</th>
        <td>JavaScript</td>
      </tr>
    </table>
  </body>
</html>
