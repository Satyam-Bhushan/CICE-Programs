<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Page Layout</title>
    <style>
      .layout {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) 3fr;
        gap: 20px;
      }
      nav,
      main {
        padding: 16px;
        border: 1px solid #ccd5df;
      }
      @media (max-width: 600px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Student Portal</h1>
    <p class="notice">
      Notice: Check the updated timetable before attending class.
    </p>
    <div class="layout">
      <nav aria-label="Page sections"><a href="#courses">Courses</a></nav>
      <main id="courses">
        <h2>Courses</h2>
        <p>Course information appears here.</p>
      </main>
    </div>
  </body>
</html>
